<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>보로노이 지각 붕괴 데모</title>
  <style>
    :root {
      color-scheme: light;
      --page: #eeeae3; --panel: #fffdf8; --text: #29251f; --muted: #756d61;
      --line: #d8d0c4; --accent: #bb4b21; --accent-soft: #f7e8da; --track: #d2c8b9;
      --view: #161411; --overlay: #f3e8d7; --overlay-bg: #181410dd;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --page: #181613; --panel: #24211c; --text: #f0e7d9; --muted: #b1a492;
        --line: #42392e; --accent: #f18545; --accent-soft: #39271d; --track: #635344;
        --view: #11100e; --overlay: #f3e8d7; --overlay-bg: #181410dd;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--text); font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; }
    main { max-width: 960px; padding: 28px 16px 24px; margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: clamp(23px, 4vw, 32px); letter-spacing: -.065em; font-weight: 800; }
    .intro { margin: 0 0 20px; color: var(--muted); font-size: 14px; line-height: 1.7; }
    .view { height: 520px; width: 100%; position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: var(--view); }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .help { position: absolute; z-index: 1; left: 12px; top: 12px; max-width: calc(100% - 24px); padding: 8px 11px; border-radius: 8px; color: var(--overlay); background: var(--overlay-bg); font-size: 11px; line-height: 1.7; pointer-events: none; }
    .help strong { color: #ffb16a; font-weight: 700; }
    .legend { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 12px; flex-wrap: wrap; padding: 7px 10px; border-radius: 7px; color: var(--overlay); background: var(--overlay-bg); font-size: 11px; pointer-events: none; }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; }
    .error { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--overlay); background: var(--view); line-height: 1.8; }
    .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
    button, select { font: inherit; color: var(--text); border: 1px solid var(--line); background: var(--panel); border-radius: 8px; }
    button { min-height: 40px; padding: 9px 14px; cursor: pointer; font-size: 13px; font-weight: 650; }
    button:first-child { background: var(--accent); border-color: var(--accent); color: var(--panel); }
    button:hover { filter: brightness(1.08); }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: .5; cursor: default; }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .controls { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px 22px; background: var(--panel); padding: 17px; border: 1px solid var(--line); border-radius: 12px; }
    .control { min-width: 0; display: block; }
    .control-top { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 8px; font-size: 12px; }
    output { color: var(--accent); font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
    input[type="range"] { display: block; width: 100%; height: 16px; margin: 0; cursor: pointer; accent-color: var(--accent); }
    .options { margin: 14px 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; font-size: 12px; }
    .options label { display: inline-flex; align-items: center; gap: 6px; }
    input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
    select { max-width: 135px; padding: 5px 8px; font-size: 12px; }
    .status { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; margin-top: 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--accent-soft); font-size: 12px; font-variant-numeric: tabular-nums; line-height: 1.5; }
    .status .live { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: 0 0 auto; }
    @media (max-width: 640px) {
      main { padding-top: 20px; }
      .controls { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding: 15px; }
      .buttons button { flex: 1 1 130px; padding-left: 9px; padding-right: 9px; }
      .help { font-size: 10px; }
      .intro { font-size: 12px; }
    }
  </style>
</head>
<body>
<main>
  <h1>보로노이 지각 붕괴</h1>
  <p class="intro">지팡이 강화 · 연소 폭발 — 화상이 돌판을 깨우고, 무너진 지각을 따라 불길이 번집니다.</p>
  <div class="view" id="view" aria-label="돌바닥에 파이어볼을 발사하는 입체 시연">
    <div class="help"><strong>바닥 클릭</strong> 발사 · <strong>드래그</strong> 회전 · <strong>휠</strong> 확대<br>터치로 회전 · 짧게 누르면 발사</div>
    <div class="legend"><span><i class="dot" style="background:#639922"></i>플레이어</span><span><i class="dot" style="background:#d85a30"></i>적</span><span><i class="dot" style="background:#ffb43e"></i>균열·화상</span><span>30 × 30미터</span></div>
  </div>
  <div class="buttons">
    <button id="fire" type="button">적 무리 쪽에 발사</button>
    <button id="redistribute" type="button">적 다시 배치</button>
    <button id="rebuild" type="button">셀 다시 만들기</button>
  </div>
  <div class="controls">
    <label class="control"><span class="control-top"><span>셀 수</span><output id="cellCountValue" for="cellCount">130개</output></span><input id="cellCount" type="range" min="60" max="220" step="1" value="130"></label>
    <label class="control"><span class="control-top"><span>폭발 반경</span><output id="radiusValue" for="radius">3미터</output></span><input id="radius" type="range" min="1.5" max="5" step="0.1" value="3"></label>
    <label class="control"><span class="control-top"><span>화상 지연</span><output id="burnDelayValue" for="burnDelay">0.8초</output></span><input id="burnDelay" type="range" min="0.2" max="2" step="0.05" value="0.8"></label>
    <label class="control"><span class="control-top"><span>전파 단계</span><output id="stepsValue" for="steps">2단계</output></span><input id="steps" type="range" min="0" max="4" step="1" value="2"></label>
    <label class="control"><span class="control-top"><span>전파 확률</span><output id="probabilityValue" for="probability">55%</output></span><input id="probability" type="range" min="0" max="1" step="0.01" value="0.55"></label>
    <label class="control"><span class="control-top"><span>전파 간격</span><output id="intervalValue" for="interval">0.22초</output></span><input id="interval" type="range" min="0.05" max="0.6" step="0.01" value="0.22"></label>
    <label class="control"><span class="control-top"><span>적 수</span><output id="enemyCountValue" for="enemyCount">12마리</output></span><input id="enemyCount" type="range" min="0" max="24" step="1" value="12"></label>
    <label class="control"><span class="control-top"><span>복구 시간</span><output id="recoveryValue" for="recovery">3초</output></span><input id="recovery" type="range" min="1" max="6" step="0.1" value="3"></label>
  </div>
  <div class="options">
    <label title="화상 적이 이동한 셀에도 지연 붕괴가 시작됩니다."><input id="chain" type="checkbox" checked>연쇄 연소</label>
    <label><input id="boundaries" type="checkbox">셀 경계 보기</label>
    <label><input id="moving" type="checkbox" checked>적 이동</label>
    <label>시점 <select id="preset"><option value="oblique">비스듬히 보기</option><option value="high">위에서 보기</option><option value="low">낮게 보기</option></select></label>
  </div>
  <div class="status" role="status"><span class="live" aria-hidden="true"></span><span id="status">대기 · 화상 적 0마리 · 붕괴 셀 0개 · 맞은 적 0마리</span></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  'use strict';

  keyLight.castShadow = true; keyLight.shadow.mapSize.set(1024, 1024);
  keyLight.shadow.camera.left = -22; keyLight.shadow.camera.right = 22;
  keyLight.shadow.camera.top = 22; keyLight.shadow.camera.bottom = -22;
  keyLight.shadow.camera.near = 1; keyLight.shadow.camera.far = 60; keyLight.shadow.bias = -.001;
  scene.add(keyLight);
  const flashLight = new THREE.PointLight(0xff8a23, 0, 16, 2); scene.add(flashLight);
  const lavaMaterial = new THREE.MeshBasicMaterial({ color: 0xdb360a, side: THREE.DoubleSide });

  const foundationMaterial = new THREE.MeshStandardMaterial({ color: 0x29251f, roughness: 1 });

  foundation.position.y = -1.2; foundation.receiveShadow = true; scene.add(foundation);
  const darkSides = new THREE.MeshStandardMaterial({ color: 0x393029, roughness: .96, flatShading: true });
  const additive = (color, opacity) => new THREE.MeshBasicMaterial({ color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false });
  const sphereGeometry = new THREE.SphereGeometry(1, 12, 8);
  const pillarGeometry = new THREE.CylinderGeometry(.7, 1, 1, 8, 1, true);
  const particleGeometry = new THREE.SphereGeometry(1, 5, 4);
  const dummy = new THREE.Object3D(), tempMatrix = new THREE.Matrix4(), scratchColor = new THREE.Color();
  const pointA = new THREE.Vector3(), pointB = new THREE.Vector3(), direction = new THREE.Vector3();
  const up = new THREE.Vector3(0, 1, 0), worldPoint = new THREE.Vector3(), localPoint = new THREE.Vector3();
  const topColor = new THREE.Color(), scorchColor = new THREE.Color(0x29221d), target = new THREE.Vector3();
  const raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();
  const floorPlane = new THREE.Plane(up, 0);
  const playerPosition = new THREE.Vector3(-10.8, 0, 10.8);
  const player = new THREE.Mesh(new THREE.CylinderGeometry(.43, .5, 1.5, 16), new THREE.MeshStandardMaterial({ color: 0x639922, roughness: .7 }));
  player.position.copy(playerPosition); player.position.y = .75; player.castShadow = true; scene.add(player);
  const playerRing = new THREE.Mesh(new THREE.RingGeometry(.68, .76, 40), additive(0x88bf34, .45));
  playerRing.rotation.x = -Math.PI / 2; playerRing.position.set(playerPosition.x, .04, playerPosition.z); scene.add(playerRing);
  const aimRing = new THREE.Mesh(new THREE.RingGeometry(.92, 1, 64), additive(0xffab4c, .55));
  aimRing.rotation.x = -Math.PI / 2; aimRing.visible = false; scene.add(aimRing);
  const enemyMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(.9, .9, .9), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: .74 }), MAX_ENEMIES);
  enemyMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); enemyMesh.castShadow = true; enemyMesh.frustumCulled = false; scene.add(enemyMesh);
  const flameMesh = new THREE.InstancedMesh(sphereGeometry, additive(0xffffff, .73), MAX_ENEMIES * 3);
  flameMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); flameMesh.frustumCulled = false; scene.add(flameMesh);
  const pillarMesh = new THREE.InstancedMesh(pillarGeometry, additive(0xffffff, .58), MAX_PILLARS);
  pillarMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); pillarMesh.frustumCulled = false; scene.add(pillarMesh);
  const particleMesh = new THREE.InstancedMesh(particleGeometry, additive(0xffffff, .84), MAX_PARTICLES);
  particleMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); particleMesh.frustumCulled = false; scene.add(particleMesh);
  const borderGeometry = new THREE.EdgesGeometry(new THREE.BoxGeometry(.96, .96, .96));
  const borderMaterial = new THREE.LineBasicMaterial({ color: 0xffa02e, transparent: true, opacity: .85 });
  const enemies = Array.from({ length: MAX_ENEMIES }, (_, id) => {
    const outline = new THREE.LineSegments(borderGeometry, borderMaterial); outline.visible = false; scene.add(outline);
    return { id, x: 0, z: 0, heading: 0, turnAt: 0, paused: false, burnEnd: 0, burnDepth: 0, hitAt: -100, hit: false, cell: -1, outline };
  });
  const particles = Array.from({ length: MAX_PARTICLES }, () => ({ active: false, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, life: 0, total: 1, size: .06, hue: .07 }));
  const pillars = Array.from({ length: MAX_PILLARS }, () => ({ active: false, x: 0, z: 0, start: 0, duration: .8, height: 1, width: .1 }));
  const projectiles = Array.from({ length: MAX_PROJECTILES }, () => {
    const body = new THREE.Mesh(sphereGeometry, additive(0xff6e17, .94)); body.visible = false; scene.add(body);
    const core = new THREE.Mesh(sphereGeometry, additive(0xffeb8e, 1)); core.visible = false; scene.add(core);
    return { active: false, start: 0, x: 0, z: 0, radius: 3, body, core, trail: 0 };
  });
  const explosions = Array.from({ length: MAX_PROJECTILES }, () => {
    const sphere = new THREE.Mesh(sphereGeometry, additive(0xff8a20, .35)); sphere.visible = false; scene.add(sphere);
    const ring = new THREE.Mesh(new THREE.RingGeometry(.9, 1, 48), additive(0xffb04a, .85)); ring.rotation.x = -Math.PI / 2; ring.visible = false; scene.add(ring);

  });
  let cells = [], seeds = [], edgeMesh = null, edgeGeometry = null, edgeMaterial = null;
  const spatialBins = Array.from({ length: 36 }, () => []);
  let particleCursor = 0, pillarCursor = 0, time = 0, lastFrame = 0, lastShot = -100, lastStatus = -1;
  let cycleActive = false, collapsedTotal = 0, hitTotal = 0, hovered = false;
  const orbit = { azimuth: -.25, polar: .73, distance: 43 };
  const ease = t => t * t * (3 - 2 * t);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  function updateCamera() {
    camera.position.set(Math.sin(orbit.azimuth) * Math.sin(orbit.polar) * orbit.distance, Math.cos(orbit.polar) * orbit.distance, Math.cos(orbit.azimuth) * Math.sin(orbit.polar) * orbit.distance);

  }
  function resize() {
    const width = view.clientWidth, height = view.clientHeight;
    camera.aspect = width / height; camera.updateProjectionMatrix(); renderer.setSize(width, height, false);
  }
  function clip(poly, nx, nz, limit) {
    const result = [];
    for (let i = 0; i < poly.length; i++) {
      const a = poly[i], b = poly[(i + 1) % poly.length];
      const da = nx * a.x + nz * a.z - limit, db = nx * b.x + nz * b.z - limit;

    }
    return result;
  }
  function makePlate(poly, cx, cz) {
    const vertices = [];
    for (let i = 0; i < poly.length; i++) {
      const a = poly[i], b = poly[(i + 1) % poly.length];
      vertices.push(0, 0, 0, b.x - cx, 0, b.z - cz, a.x - cx, 0, a.z - cz);
    }
    const topCount = vertices.length / 3;
    for (let i = 0; i < poly.length; i++) {
      const a = poly[i], b = poly[(i + 1) % poly.length];
      const ax = a.x - cx, az = a.z - cz, bx = b.x - cx, bz = b.z - cz;

  function makeCells() {
    clearCycle(true);
    for (const cell of cells) { scene.remove(cell.mesh); cell.mesh.geometry.dispose(); cell.material.dispose(); }
    if (edgeMesh) { scene.remove(edgeMesh); edgeGeometry.dispose(); edgeMaterial.dispose(); }

    const count = settings.cellCount, rows = Math.round(Math.sqrt(count));

        direction.subVectors(pointB, pointA); const length = direction.length();
        dummy.position.copy(pointA).add(pointB).multiplyScalar(.5); dummy.quaternion.setFromUnitVectors(up, direction.normalize()); dummy.scale.set(1, length, 1); dummy.updateMatrix();

      }

      let minX = HALF, maxX = -HALF, minZ = HALF, maxZ = -HALF;
