<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>자기력선 보스 패턴 데모 v2</title>
  <style>
    :root {
      color-scheme: light;
      --page: #e9edf2; --panel: #f7f9fc; --text: #202d3c; --muted: #5e6f81;
      --border: #ccd5e0; --accent: #227b9a; --button: #263c51; --button-text: #fff;
      --chip: #e6edf4; --hit: #bc3f44; --safe: #437b30;
      --view: #0b121c; --overlay: #0b1424d9; --view-text: #e3edf8;
      --view-muted: #a4b7cb; --north: #e24b4a; --south: #378add; --player: #639922;
      --warning: #88dcff; --spike: #ffd9a0; --rest: #b3c3d3; --focus: #3da9cc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --page: #101722; --panel: #17212e; --text: #e2eaf4; --muted: #99abc0;
        --border: #2c3b4e; --accent: #76d0ea; --button: #3f829b; --button-text: #fff;
        --chip: #202e3e; --hit: #ff8787; --safe: #aad783;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--text); font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; }
    main { max-width: 960px; margin: 0 auto; padding: 27px 16px 22px; }
    .eyebrow { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .12em; margin-bottom: 7px; }
    h1 { font-size: clamp(24px, 4vw, 32px); letter-spacing: -.05em; margin: 0 0 7px; }
    .intro { color: var(--muted); font-size: 13px; line-height: 1.65; margin: 0 0 19px; }
    .view { position: relative; height: 520px; width: 100%; overflow: hidden; border: 1px solid var(--border); border-radius: 14px; background: var(--view); }
    .view canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; cursor: crosshair; }
    .view:focus-within { outline: 2px solid var(--focus); outline-offset: 3px; }
    .guide { position: absolute; left: 14px; top: 13px; padding: 9px 11px; border-radius: 8px; background: var(--overlay); color: var(--view-muted); font-size: 10px; line-height: 1.7; pointer-events: none; }
    .guide strong { font-weight: 600; color: var(--view-text); }
    .stage-badge { position: absolute; top: 15px; right: 15px; min-width: 82px; text-align: center; padding: 7px 10px; color: var(--warning); background: var(--overlay); border-radius: 7px; font-size: 12px; font-weight: 700; pointer-events: none; }
    .stage-badge[data-stage="spike"] { color: var(--spike); }
    .stage-badge[data-stage="rest"] { color: var(--rest); }
    .legend { position: absolute; bottom: 15px; left: 15px; display: flex; gap: 13px; padding: 7px 10px; border-radius: 7px; color: var(--view-muted); background: var(--overlay); font-size: 10px; pointer-events: none; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--north); }
    .dot.south { background: var(--south); } .dot.player { background: var(--player); }
    .feedback { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); color: var(--view-text); font-size: 15px; font-weight: 700; opacity: 0; pointer-events: none; text-shadow: 0 2px 10px var(--view); transition: opacity .12s; white-space: nowrap; }
    .hit-flash { position: absolute; inset: 0; background: radial-gradient(ellipse, #ff354522, #ff233ba6); opacity: 0; pointer-events: none; }
    .error { position: absolute; inset: 0; display: grid; place-content: center; padding: 25px; text-align: center; color: var(--view-text); font-size: 14px; line-height: 1.8; background: var(--view); }
    .error[hidden] { display: none; }
    .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 15px 0; }
    button { border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 8px; padding: 10px 14px; font: inherit; font-size: 12px; font-weight: 650; cursor: pointer; }
    button.primary { background: var(--button); color: var(--button-text); border-color: var(--button); }
    button:hover { filter: brightness(1.1); } button:active { transform: translateY(1px); }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .scores { display: flex; gap: 13px; flex-wrap: wrap; margin-left: auto; font-size: 12px; color: var(--muted); }
    .scores b { margin-left: 4px; font-size: 16px; color: var(--text); font-variant-numeric: tabular-nums; }
    .scores .hits b { color: var(--hit); } .scores .dodges b { color: var(--safe); }
    .controls { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    .slider-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 17px 27px; }
    .slider-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; font-size: 12px; }
    output { color: var(--accent); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; margin: 0; display: block; accent-color: var(--accent); cursor: pointer; }
    .options { display: flex; gap: 12px 19px; align-items: center; flex-wrap: wrap; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 12px; }
    .options label { display: inline-flex; gap: 6px; align-items: center; }
    input[type="checkbox"] { margin: 0; accent-color: var(--accent); }
    select { min-width: 0; max-width: 100%; background: var(--chip); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 7px 8px; font: inherit; font-size: 12px; }
    .status { color: var(--muted); margin-top: 12px; font-size: 11px; line-height: 1.7; font-variant-numeric: tabular-nums; }
    @media (max-width: 560px) {
      main { padding-top: 20px; } .slider-grid { grid-template-columns: 1fr; gap: 17px; }
      .scores { width: 100%; margin-left: 0; padding-top: 4px; } .guide { font-size: 9px; left: 10px; top: 10px; padding: 7px 8px; }
      .stage-badge { top: 12px; right: 10px; font-size: 10px; min-width: 68px; }
      .legend { left: 10px; bottom: 10px; gap: 10px; } .feedback { bottom: 47px; }
      .options { align-items: flex-start; } .options .layout-option { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">보스 패턴 시안 · 자기장</div>
      <h1>자기력선 보스 패턴 데모 v2</h1>
      <p class="intro">은빛 쇳가루 사이로 북극에서 남극으로 빛이 흐릅니다. 예고선을 읽고, 파도처럼 솟아오르는 가시를 피하세요.</p>
    </header>
    <div class="view" id="view">
      <div class="guide"><strong>마우스 올리기 / 클릭</strong> 이동 · <strong>WASD</strong> 이동<br><strong>드래그</strong> 시점 회전 · <strong>휠</strong> 확대 / 축소</div>
      <div class="stage-badge" id="stageBadge">준비</div>
      <div class="legend"><span><i class="dot"></i>북극</span><span><i class="dot south"></i>남극</span><span><i class="dot player"></i>플레이어</span></div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
      <div class="hit-flash" id="hitFlash" aria-hidden="true"></div>
      <div class="error" id="error" hidden></div>
    </div>
    <div class="toolbar">
      <button class="primary" id="nextPhase" type="button">다음 페이즈</button>
      <button id="reset" type="button">처음부터</button>
      <div class="scores"><span>페이즈<b id="phaseValue">1</b></span><span class="hits">맞음<b id="hitValue">0</b></span><span class="dodges">회피<b id="dodgeValue">0</b></span></div>
    </div>
    <div class="controls">
      <div class="slider-grid">
        <div><div class="slider-head"><label for="lineCount">선 개수 · 북극마다</label><output id="lineOutput" for="lineCount">8개</output></div><input id="lineCount" type="range" min="4" max="16" step="1" value="8"></div>
        <div><div class="slider-head"><label for="warningTime">예고 시간</label><output id="warningOutput" for="warningTime">1.4초</output></div><input id="warningTime" type="range" min="0.5" max="3" step="0.1" value="1.4"></div>
        <div><div class="slider-head"><label for="poleSpeed">극 이동 속도</label><output id="speedOutput" for="poleSpeed">15도/초</output></div><input id="poleSpeed" type="range" min="0" max="40" step="1" value="15"></div>
        <div><div class="slider-head"><label for="hitWidth">가시 판정 폭</label><output id="widthOutput" for="hitWidth">0.55미터</output></div><input id="hitWidth" type="range" min="0.3" max="1.2" step="0.05" value="0.55"></div>
      </div>
      <div class="options">
        <label class="layout-option" for="poleLayout">극 배치 <select id="poleLayout"><option value="2">북극 1 · 남극 1</option><option value="3">북극 1 · 남극 2</option><option value="4">북극 2 · 남극 2</option></select></label>
        <label><input id="showPowder" type="checkbox" checked>쇳가루 보기</label>
        <label><input id="bendLines" type="checkbox" checked>예고 중 선 휘어짐</label>
      </div>
    </div>
    <div class="status" id="status" role="status">준비 · 극 2개 · 선 8개 · 맞음 0 / 회피 0 · FPS 0</div>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
  (() => {
    'use strict';
    const $ = id => document.getElementById(id);
    const ui = {
      view: $('view'), stage: $('stageBadge'), status: $('status'), error: $('error'), feedback: $('feedback'),
      lines: $('lineCount'), warning: $('warningTime'), speed: $('poleSpeed'), width: $('hitWidth'),
      layout: $('poleLayout'), powder: $('showPowder'), bend: $('bendLines'),
      phase: $('phaseValue'), hit: $('hitValue'), dodge: $('dodgeValue'), hitFlash: $('hitFlash')
    };
    function fail(message) { ui.error.textContent = message; ui.error.hidden = false; ui.status.textContent = message; }
    if (!window.THREE) { fail('삼차원 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해 주세요.'); return; }
    let renderer;
    try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' }); }
    catch (error) { fail('삼차원 화면을 시작하지 못했습니다. 브라우저의 하드웨어 가속 설정을 확인해 주세요.'); return; }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    renderer.shadowMap.enabled = false;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.setClearColor(0x0b121c);
    const canvas = renderer.domElement;
    canvas.tabIndex = 0;
    canvas.setAttribute('aria-label', '자기력선 경기장. 마우스 올리기로 이동, 드래그로 회전, 클릭 후 이동 키로 이동합니다.');
    ui.view.prepend(canvas);
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x0b121c, 36, 76);
    const camera = new THREE.PerspectiveCamera(47, 1, 0.1, 100);
    const orbit = { azimuth: 0.32, elevation: 0.86, radius: 36 };
    const target = new THREE.Vector3(0, 0.25, 0);
    const cameraBase = new THREE.Vector3();
    function updateCamera() {
      const flat = orbit.radius * Math.cos(orbit.elevation);
      camera.position.set(Math.sin(orbit.azimuth) * flat, Math.sin(orbit.elevation) * orbit.radius, Math.cos(orbit.azimuth) * flat);
      cameraBase.copy(camera.position); camera.lookAt(target); camera.updateMatrixWorld();
    }
    updateCamera();
    function resize() {
      const width = ui.view.clientWidth, height = ui.view.clientHeight;
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      // Keep the entire arena in view on narrow screens without changing the 520px view.
      camera.fov = THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(47 / 2)) / Math.min(1, camera.aspect)));
      camera.updateProjectionMatrix();
    }
    new ResizeObserver(resize).observe(ui.view);
    resize();
    scene.add(new THREE.HemisphereLight(0x9ebadb, 0x0b0e15, 0.27));
    const keyLight = new THREE.DirectionalLight(0xc1d8f5, 0.62); keyLight.position.set(-8, 16, 10); scene.add(keyLight);
    const rimLight = new THREE.DirectionalLight(0x4986b6, 0.3); rimLight.position.set(8, 5, -12); scene.add(rimLight);
    const arenaRadius = 15;
    const floor = new THREE.Mesh(new THREE.CylinderGeometry(15, 15, 0.32, 96), new THREE.MeshStandardMaterial({ color: 0x202a37, metalness: 0.78, roughness: 0.69 }));
    floor.position.y = -0.16; scene.add(floor);
    const plinth = new THREE.Mesh(new THREE.CylinderGeometry(15.25, 15.35, 0.4, 96), new THREE.MeshStandardMaterial({ color: 0x101a28, metalness: 0.8, roughness: 0.45 }));
    plinth.position.y = -0.46; scene.add(plinth);
    const glowMaterial = new THREE.MeshBasicMaterial({ color: 0x73ccf7, transparent: true, opacity: 0.34, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
    const boundary = new THREE.Mesh(new THREE.RingGeometry(14.92, 15.03, 96), glowMaterial);
    boundary.rotation.x = -Math.PI / 2; boundary.position.y = 0.017; scene.add(boundary);
    // Engraving is drawn only once: one textured disc replaces all seam draw calls.
    const floorCanvas = document.createElement('canvas'); floorCanvas.width = floorCanvas.height = 1024;
    const floorContext = floorCanvas.getContext('2d');
    floorContext.fillStyle = '#161e29'; floorContext.fillRect(0, 0, 1024, 1024);
    floorContext.strokeStyle = '#344459'; floorContext.lineWidth = 1.2;
    for (let r = 64; r < 510; r += 64) {
      floorContext.beginPath(); floorContext.arc(512, 512, r, 0, Math.PI * 2); floorContext.stroke();
    }
    floorContext.strokeStyle = '#29394b'; floorContext.lineWidth = 1;
    for (let i = 0; i < 48; i++) {
      const angle = i * Math.PI / 24;
      floorContext.beginPath(); floorContext.moveTo(512 + Math.cos(angle) * 34, 512 + Math.sin(angle) * 34);
      floorContext.lineTo(512 + Math.cos(angle) * 511, 512 + Math.sin(angle) * 511); floorContext.stroke();
    }
    const floorTexture = new THREE.CanvasTexture(floorCanvas); floorTexture.encoding = THREE.sRGBEncoding;
    const etchedFloor = new THREE.Mesh(new THREE.CircleGeometry(14.98, 96), new THREE.MeshStandardMaterial({ map: floorTexture, metalness: 0.82, roughness: 0.58 }));
    etchedFloor.rotation.x = -Math.PI / 2; etchedFloor.position.y = 0.006; scene.add(etchedFloor);
    const wall = new THREE.Mesh(new THREE.CylinderGeometry(15.1, 15.1, 0.55, 96, 1, true), new THREE.MeshStandardMaterial({ color: 0x1b2939, metalness: 0.85, roughness: 0.43, side: THREE.DoubleSide }));
    wall.position.y = 0.22; scene.add(wall);
    const dummy = new THREE.Object3D();
    const color = new THREE.Color();
    const axisY = new THREE.Vector3(0, 1, 0), direction = new THREE.Vector3();
    const markers = new THREE.InstancedMesh(new THREE.BoxGeometry(0.045, 0.022, 0.25), glowMaterial, 72);
    for (let i = 0; i < 72; i++) {
      const angle = i * Math.PI * 2 / 72;
      dummy.position.set(14.65 * Math.sin(angle), 0.022, 14.65 * Math.cos(angle));
      dummy.rotation.set(0, angle, 0); dummy.scale.set(1, 1, 1); dummy.updateMatrix(); markers.setMatrixAt(i, dummy.matrix);
    }
    scene.add(markers);
    const bossMaterial = new THREE.MeshStandardMaterial({ color: 0x858d98, metalness: 0.82, roughness: 0.32 });
    const boss = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.6, 1.6), bossMaterial);
    boss.position.y = 1.2; scene.add(boss);
    const bossEdges = new THREE.LineSegments(new THREE.EdgesGeometry(boss.geometry), new THREE.LineBasicMaterial({ color: 0xb7c6d9, transparent: true, opacity: 0.5 }));
    boss.add(bossEdges);
    const coreLight = new THREE.PointLight(0x689bc7, 0.45, 6, 2); coreLight.position.set(0, 2, 0); scene.add(coreLight);
    function labelSprite(text, tint) {
      const image = document.createElement('canvas'); image.width = 128; image.height = 64;
      const context = image.getContext('2d'); context.font = 'bold 26px sans-serif'; context.textAlign = 'center';
      context.fillStyle = tint; context.shadowColor = '#000'; context.shadowBlur = 5; context.fillText(text, 64, 39);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(image), transparent: true, depthWrite: false }));
      sprite.scale.set(1.6, 0.8, 1); sprite.position.y = 0.85; return sprite;
    }
    const poleGeometry = new THREE.BoxGeometry(0.9, 0.9, 0.9);
    const poleMaterials = [
      new THREE.MeshStandardMaterial({ color: 0xe24b4a, emissive: 0xe24b4a, emissiveIntensity: 0.25, metalness: 0.65, roughness: 0.32 }),
      new THREE.MeshStandardMaterial({ color: 0x378add, emissive: 0x378add, emissiveIntensity: 0.25, metalness: 0.65, roughness: 0.32 })
    ];
    const northLabel = labelSprite('N · 북극', '#ffa09b'), southLabel = labelSprite('S · 남극', '#88c6ff');
    const poleRingGeometry = new THREE.TorusGeometry(0.87, 0.026, 5, 48);
    const poleGlowGeometry = new THREE.CircleGeometry(1.55, 48);
    const poleGlowVertex = `varying vec2 vDisc; void main() { vDisc = uv * 2.0 - 1.0; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
    const poleGlowFragment = `uniform vec3 uTint; uniform float uPulse; varying vec2 vDisc;
      void main() { float r = length(vDisc); float glow = pow(max(0.0, 1.0 - r), 2.0);
        glow += 0.2 * exp(-80.0 * abs(r - 0.59)); gl_FragColor = vec4(uTint, glow * uPulse); }`;
    const poles = [];
    for (let i = 0; i < 4; i++) {
      const mesh = new THREE.Mesh(poleGeometry, poleMaterials[i % 2]);
      const north = northLabel.clone(), south = southLabel.clone(); mesh.add(north, south);
      scene.add(mesh);
      const ringMaterial = new THREE.MeshBasicMaterial({ color: 0xe24b4a, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false });
      const ringA = new THREE.Mesh(poleRingGeometry, ringMaterial), ringB = new THREE.Mesh(poleRingGeometry, ringMaterial);
      scene.add(ringA, ringB);
      const halo = new THREE.Mesh(poleGlowGeometry, new THREE.ShaderMaterial({
        uniforms: { uTint: { value: new THREE.Color(0xe24b4a) }, uPulse: { value: 0.7 } },
        vertexShader: poleGlowVertex, fragmentShader: poleGlowFragment,
        transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
      }));
      halo.rotation.x = -Math.PI / 2; halo.position.y = 0.035; scene.add(halo);
      poles.push({ mesh, halo, ringA, ringB, north, south, x: 0, z: 0, q: 1, radius: 6 + i * 0.8 });
    }
    const playerMaterial = new THREE.MeshStandardMaterial({ color: 0x639922, emissive: 0x24400b, emissiveIntensity: 0.38, metalness: 0.35, roughness: 0.45 });
    const player = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.38, 1.1, 18), playerMaterial);
    player.position.set(6, 0.55, 8); scene.add(player);
    const playerRing = new THREE.Mesh(new THREE.RingGeometry(0.46, 0.52, 32), new THREE.MeshBasicMaterial({ color: 0xa1d663, transparent: true, opacity: 0.8, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false }));
    playerRing.rotation.x = -Math.PI / 2; playerRing.position.set(6, 0.034, 8); scene.add(playerRing);
    const hitRing = new THREE.Mesh(new THREE.RingGeometry(0.7, 0.79, 48), new THREE.MeshBasicMaterial({ color: 0xff3548, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
    hitRing.rotation.x = -Math.PI / 2; hitRing.visible = false; scene.add(hitRing);
    const destination = new THREE.Mesh(new THREE.RingGeometry(0.25, 0.32, 24), new THREE.MeshBasicMaterial({ color: 0xbce78d, transparent: true, opacity: 0.55, side: THREE.DoubleSide, depthWrite: false }));
    destination.rotation.x = -Math.PI / 2; destination.visible = false; scene.add(destination);
    const enemy = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.9), new THREE.MeshStandardMaterial({ color: 0xd85a30, metalness: 0.4, roughness: 0.5 }));
    enemy.position.set(-7, 0.45, 5); scene.add(enemy);
    const enemyMotion = { timer: 0, angle: 0, stopped: false };
    // Bounded pools: two north poles × 16 lines × 160 RK2 steps.
    const MAX_LINES = 32, MAX_STEPS = 160, MAX_SEGMENTS = MAX_LINES * MAX_STEPS;
    const MAX_SPIKES = 4608, POWDER_COUNT = 3000, FLOW_PER_LINE = 8;
    const WAVE_DURATION = 0.25, SPIKE_RISE = 0.055;
    const lineX = new Float32Array(MAX_LINES * (MAX_STEPS + 1));
    const lineZ = new Float32Array(lineX.length), lineLength = new Uint16Array(MAX_LINES);
    const lineDistance = new Float32Array(lineX.length), lineTotal = new Float32Array(MAX_LINES);
    const segmentX = new Float32Array(MAX_SEGMENTS), segmentZ = new Float32Array(MAX_SEGMENTS);
    const segmentDX = new Float32Array(MAX_SEGMENTS), segmentDZ = new Float32Array(MAX_SEGMENTS);
    const segmentLengthSq = new Float32Array(MAX_SEGMENTS), segmentStart = new Float32Array(MAX_SEGMENTS);
    const segmentEnd = new Float32Array(MAX_SEGMENTS), segmentLine = new Uint8Array(MAX_SEGMENTS);
    let actualLines = 0, segmentCount = 0, spikeCount = 0, activePerPole = 8;
    const northColor = new THREE.Color(0xff453d), middleColor = new THREE.Color(0xa367ff), southColor = new THREE.Color(0x49b7ff);
    function fieldColor(progress) {
      if (progress < 0.5) color.copy(northColor).lerp(middleColor, progress * 2);
      else color.copy(middleColor).lerp(southColor, progress * 2 - 1);
    }
    function uploadRange(attribute, count) {
      attribute.updateRange.offset = 0; attribute.updateRange.count = count * attribute.itemSize; attribute.needsUpdate = true;
    }
    function initializeIdentityMatrices(mesh) {
      // r128 starts these arrays at zero, including homogeneous w; initialise once.
      const matrices = mesh.instanceMatrix.array;
      for (let m = 0; m < matrices.length; m += 16) matrices[m] = matrices[m + 5] = matrices[m + 10] = matrices[m + 15] = 1;
      mesh.instanceMatrix.needsUpdate = true;
    }

    function stepPattern(dt) {
      if (stage === 'ready') return;
      stageTime += dt;
      if (stage === 'warning') {
        lineTimer += dt;
        if (lineTimer >= 0.15 && (ui.bend.checked || linesDirty)) { lineTimer %= 0.15; linesDirty = false; calculateLines(); }
        if (stageTime >= warningDuration) { enterSpikes(); testPlayerHit(player.position.x, player.position.z); }
      } else if (stage === 'spike') {
        // A stationary player can be hit when the wave reaches them this frame.
        testPlayerHit(player.position.x, player.position.z);
        if (stageTime >= 0.5) {
          if (!hitThisCycle) { dodges++; showFeedback('회피 성공', '#b4e48a'); }
          stage = 'rest'; stageTime = 0; updateStatus();
        }
      } else if (stageTime >= 0.8) { startWarning(); }
    }
    function rounded(value, decimals) { return String(Math.round(value * Math.pow(10, decimals)) / Math.pow(10, decimals)); }
    function updateOutputs() {
      $('lineOutput').textContent = rounded(+ui.lines.value, 0) + '개';
      $('warningOutput').textContent = rounded(+ui.warning.value, 1) + '초';
      $('speedOutput').textContent = rounded(+ui.speed.value, 0) + '도/초';
      $('widthOutput').textContent = rounded(+ui.width.value, 2) + '미터';
    }
    function updateStatus() {
      const name = stage === 'warning' ? '예고 ' + rounded(Math.max(0, warningDuration - stageTime), 1) + '초' : stage === 'spike' ? '가시' : stage === 'rest' ? '휴식' : '준비';
      ui.stage.textContent = name; ui.stage.dataset.stage = stage;
      ui.phase.textContent = phase; ui.hit.textContent = hits; ui.dodge.textContent = dodges;
      const total = actualLines || Math.round(+ui.lines.value) * (poleCount === 4 ? 2 : 1);
      ui.status.textContent = name + ' · 극 ' + poleCount + '개 · 선 ' + (actualLines ? activePerPole : Math.round(+ui.lines.value)) + '개/북극 (전체 ' + total + '개) · 맞음 ' + hits + ' / 회피 ' + dodges + ' · FPS ' + fps;
    }
    const raycaster = new THREE.Raycaster(), pointerNDC = new THREE.Vector2(), groundPoint = new THREE.Vector3();
    const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    const movementTarget = new THREE.Vector3();
    const pointer = { inside: false, down: false, buttons: 0, dragging: false, x: 0, y: 0, startX: 0, startY: 0, lastX: 0, lastY: 0, id: -1, touch: false };
    const keys = { w: false, a: false, s: false, d: false };
    let hasMovementTarget = false, clickTarget = false;
    function setGroundTarget(clientX, clientY) {
      const bounds = canvas.getBoundingClientRect();
      pointerNDC.set((clientX - bounds.left) / bounds.width * 2 - 1, -(clientY - bounds.top) / bounds.height * 2 + 1);
      raycaster.setFromCamera(pointerNDC, camera);
      if (!raycaster.ray.intersectPlane(groundPlane, groundPoint)) { hasMovementTarget = false; return; }
      const length = Math.hypot(groundPoint.x, groundPoint.z);
      if (length > 14.45) { groundPoint.x *= 14.45 / length; groundPoint.z *= 14.45 / length; }
      movementTarget.copy(groundPoint); hasMovementTarget = true;
      destination.position.set(groundPoint.x, 0.039, groundPoint.z);
    }
    canvas.addEventListener('pointerenter', event => {
      pointer.inside = true; pointer.buttons = event.buttons; pointer.x = event.clientX; pointer.y = event.clientY;
      if (!pointer.down && event.buttons === 0 && event.pointerType !== 'touch') { clickTarget = false; setGroundTarget(event.clientX, event.clientY); }
    });
    canvas.addEventListener('pointermove', event => {
      pointer.x = event.clientX; pointer.y = event.clientY; pointer.buttons = event.buttons;
      if (pointer.down && event.pointerId === pointer.id) {
        if (Math.hypot(event.clientX - pointer.startX, event.clientY - pointer.startY) >= 5) pointer.dragging = true;
        if (pointer.dragging) {
          orbit.azimuth -= (event.clientX - pointer.lastX) * 0.007;
          orbit.elevation = clamp(orbit.elevation + (event.clientY - pointer.lastY) * 0.006, 0.3, 1.35);
          updateCamera(); hasMovementTarget = false; clickTarget = false;
        }
        pointer.lastX = event.clientX; pointer.lastY = event.clientY;
      } else if (pointer.inside && event.buttons === 0 && event.pointerType !== 'touch') {
        clickTarget = false; setGroundTarget(event.clientX, event.clientY);
      } else if (event.buttons !== 0) {
        hasMovementTarget = false;
      }
    });
    canvas.addEventListener('pointerdown', event => {
      if (pointer.down) return;
      pointer.down = true; pointer.buttons = event.buttons; pointer.dragging = false; pointer.id = event.pointerId; pointer.touch = event.pointerType === 'touch';
      pointer.startX = pointer.lastX = pointer.x = event.clientX; pointer.startY = pointer.lastY = pointer.y = event.clientY;
      hasMovementTarget = false; clickTarget = false; canvas.setPointerCapture(event.pointerId); canvas.focus({ preventScroll: true });
    });
    canvas.addEventListener('pointerup', event => {
      if (event.pointerId !== pointer.id) return;
      const wasClick = !pointer.dragging && Math.hypot(event.clientX - pointer.startX, event.clientY - pointer.startY) < 5;
      pointer.down = false; pointer.buttons = event.buttons; pointer.dragging = false;
      if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
      const bounds = canvas.getBoundingClientRect();
      pointer.inside = event.clientX >= bounds.left && event.clientX <= bounds.right && event.clientY >= bounds.top && event.clientY <= bounds.bottom;
      if (wasClick && pointer.inside) { setGroundTarget(event.clientX, event.clientY); clickTarget = true; }
      pointer.id = -1;
    });
    function cancelPointer() { pointer.down = false; pointer.buttons = 0; pointer.dragging = false; pointer.id = -1; hasMovementTarget = false; clickTarget = false; }
    canvas.addEventListener('pointercancel', cancelPointer);
    canvas.addEventListener('lostpointercapture', () => { if (pointer.down) cancelPointer(); });
    canvas.addEventListener('pointerleave', () => { pointer.inside = false; if (!pointer.down) hasMovementTarget = false; });
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    canvas.addEventListener('wheel', event => { event.preventDefault(); orbit.radius = clamp(orbit.radius * Math.exp(event.deltaY * 0.001), 22, 65); updateCamera(); }, { passive: false });
    const keyMap = { KeyW: 'w', KeyA: 'a', KeyS: 's', KeyD: 'd' };
    canvas.addEventListener('keydown', event => { const key = keyMap[event.code]; if (key) { event.preventDefault(); keys[key] = true; clickTarget = false; hasMovementTarget = false; } });
    window.addEventListener('keyup', event => { const key = keyMap[event.code]; if (key) keys[key] = false; });
    function clearKeys() { keys.w = keys.a = keys.s = keys.d = false; }
    canvas.addEventListener('blur', () => { clearKeys(); hasMovementTarget = false; });
    window.addEventListener('blur', () => { clearKeys(); cancelPointer(); pointer.inside = false; });
    function movePlayer(dt) {
      const previousX = player.position.x, previousZ = player.position.z;
      const forward = Number(keys.w) - Number(keys.s), right = Number(keys.d) - Number(keys.a);
      if (forward || right) {
        const length = Math.hypot(forward, right), speed = 4.5 * dt / length;
        const sin = Math.sin(orbit.azimuth), cos = Math.cos(orbit.azimuth);
        player.position.x += (-sin * forward + cos * right) * speed;
        player.position.z += (-cos * forward - sin * right) * speed;
        hasMovementTarget = false;
      } else {
        if (hasMovementTarget && !pointer.down && pointer.buttons === 0) {
          const dx = movementTarget.x - player.position.x, dz = movementTarget.z - player.position.z, distance = Math.hypot(dx, dz);
          if (distance > 0.025) {
            const step = Math.min(distance, 4.5 * dt); player.position.x += dx / distance * step; player.position.z += dz / distance * step;
          } else if (clickTarget) { hasMovementTarget = false; clickTarget = false; }
        }
      }
      const radius = Math.hypot(player.position.x, player.position.z);
      if (radius > 14.45) { player.position.x *= 14.45 / radius; player.position.z *= 14.45 / radius; }
      playerRing.position.set(player.position.x, 0.034, player.position.z);
      destination.visible = hasMovementTarget && !pointer.down && !(forward || right);
      testPlayerHit(previousX, previousZ);
    }
    function moveEnemy(dt) {
      enemyMotion.timer -= dt;
      if (enemyMotion.timer <= 0) {
        enemyMotion.timer = 0.8 + random() * 1.6; enemyMotion.stopped = random() < 0.3; enemyMotion.angle = random() * Math.PI * 2;
      }
      if (enemyMotion.stopped) return;
      enemy.position.x += Math.cos(enemyMotion.angle) * dt * 0.8; enemy.position.z += Math.sin(enemyMotion.angle) * dt * 0.8;
      const radius = Math.hypot(enemy.position.x, enemy.position.z);
      if (radius > 12.5) { enemy.position.x *= 12.5 / radius; enemy.position.z *= 12.5 / radius; enemyMotion.angle += Math.PI; }
      enemy.rotation.y = -enemyMotion.angle;
    }
    function scheduleStart() { clearTimeout(autoStart); autoStart = setTimeout(startWarning, 500); }
    function resetDemo() {
      clearTimeout(autoStart); phase = 1; hits = dodges = 0; poleCount = 2; orbitAngle = 0;
      ui.lines.value = 8; ui.warning.value = 1.4; ui.speed.value = 15; ui.width.value = 0.55; ui.layout.value = 2;
      ui.powder.checked = true; ui.bend.checked = true;
      stage = 'ready'; stageTime = 0; flashTime = hitRingTime = shakeTime = feedbackTime = 0; actualLines = segmentCount = spikeCount = 0;
      telegraphs.count = spikes.count = sparkles.count = flow.count = 0; cellHead.fill(-1); updateSpikes(0);
      hitRing.visible = false; ui.hitFlash.style.opacity = '0';
      player.position.set(6, 0.55, 8); enemy.position.set(-7, 0.45, 5); enemyMotion.timer = 0;
      playerMaterial.color.setHex(0x639922); playerMaterial.emissive.setHex(0x24400b);
      ui.feedback.style.opacity = '0'; cancelPointer(); pointer.inside = false; clearKeys();
      orbit.azimuth = 0.32; orbit.elevation = 0.86; orbit.radius = 36; updateCamera();
      updatePoles(0, 0); updateOutputs(); updateStatus(); scheduleStart();
    }
    $('reset').addEventListener('click', resetDemo);
    $('nextPhase').addEventListener('click', () => {
      clearTimeout(autoStart); phase++; poleCount = Math.min(4, phase + 1); ui.layout.value = poleCount;
      ui.lines.value = Math.min(16, +ui.lines.value + 2); ui.speed.value = Math.min(40, +ui.speed.value + 5);
      updatePoles(0, elapsed); updateOutputs(); startWarning();
    });
    ui.layout.addEventListener('change', () => { clearTimeout(autoStart); poleCount = +ui.layout.value; updatePoles(0, elapsed); startWarning(); });
    ui.lines.addEventListener('input', () => { updateOutputs(); if (stage === 'warning') linesDirty = true; updateStatus(); });
    ui.warning.addEventListener('input', () => { updateOutputs(); if (stage === 'warning') warningDuration = +ui.warning.value; });
    ui.speed.addEventListener('input', updateOutputs); ui.width.addEventListener('input', updateOutputs);
    ui.powder.addEventListener('change', () => { powder.visible = ui.powder.checked; });
    ui.bend.addEventListener('change', () => { if (stage === 'warning') startWarning(); });
    canvas.addEventListener('webglcontextlost', event => { event.preventDefault(); fail('삼차원 화면 연결이 끊겼습니다. 새로고침해 주세요.'); });
    let elapsed = 0, lastTime = 0, statusTimer = 0;
    document.addEventListener('visibilitychange', () => { lastTime = 0; fpsElapsed = 0; fpsFrames = 0; clearKeys(); });
    function updateHitEffects(dt) {
      flashTime = Math.max(0, flashTime - dt); hitRingTime = Math.max(0, hitRingTime - dt);
      const flash = flashTime / 0.2;
      playerMaterial.color.setHex(flash > 0 ? 0xff4545 : 0x639922);
      playerMaterial.emissive.setHex(flash > 0 ? 0xb52121 : 0x24400b);
      ui.hitFlash.style.opacity = String(flash * 0.8);
      hitRing.visible = hitRingTime > 0;
      if (hitRing.visible) {
        hitRing.scale.setScalar(1 + (1 - hitRingTime / 0.45) * 4); hitRing.material.opacity = hitRingTime / 0.45;
      }
      shakeTime = Math.max(0, shakeTime - dt);
      camera.position.copy(cameraBase);
      if (shakeTime > 0) {
        const amplitude = 0.075 * shakeTime / 0.15;
        camera.position.x += Math.sin(elapsed * 117) * amplitude;
        camera.position.y += Math.sin(elapsed * 143) * amplitude * 0.7;
      }
      camera.updateMatrixWorld();
    }
    function animate(timestamp) {
      requestAnimationFrame(animate);
      if (document.hidden || renderer.getContext().isContextLost()) { lastTime = 0; return; }
      const rawDt = lastTime ? (timestamp - lastTime) / 1000 : 0;
      const dt = Math.min(rawDt, 0.05);
      if (rawDt > 0) {
        fpsElapsed += rawDt; fpsFrames++;
        if (fpsElapsed >= 0.5) { fps = Math.round(fpsFrames / fpsElapsed); fpsElapsed = 0; fpsFrames = 0; updateStatus(); }
      }
      lastTime = timestamp; elapsed += dt;
      updatePoles(dt, elapsed); movePlayer(dt); moveEnemy(dt); stepPattern(dt);
      if (stage === 'warning') {
        const progress = clamp(stageTime / warningDuration, 0, 1);
        telegraphs.visible = true; telegraphMaterial.opacity = (0.17 + progress * 0.7) * (0.8 + Math.sin(elapsed * 17) * 0.2);
        updateSpikes(0);
      } else if (stage === 'spike') {
        telegraphs.visible = true; telegraphMaterial.opacity = 0.3;
        updateSpikes(1);
      } else if (stage === 'rest') {
        const sink = Math.pow(clamp(1 - stageTime / 0.6, 0, 1), 2);
        telegraphMaterial.opacity = 0.24 * sink; telegraphs.visible = sink > 0.002; updateSpikes(sink);
      }
      updatePowder(elapsed); updateFlow(elapsed); updateHitEffects(dt);
      feedbackTime = Math.max(0, feedbackTime - dt); if (feedbackTime === 0) ui.feedback.style.opacity = '0';
      statusTimer += dt; if (statusTimer >= 0.1) { statusTimer = 0; updateStatus(); }
      renderer.render(scene, camera);
    }
    cellHead.fill(-1); updatePoles(0, 0); updateOutputs(); updatePowder(0); updateStatus();
    // Automatic first demonstration; no click is needed to start the cycle.
    scheduleStart(); requestAnimationFrame(animate);
  })();
  </script>
