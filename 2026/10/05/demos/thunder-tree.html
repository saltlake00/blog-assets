<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>썬더형 번개 나무 데모 v2</title>
  <style>
    :root {
      color-scheme: light;
      --page: #eef1f5; --panel: #ffffff; --text: #1c2b3b; --muted: #526578;
      --border: #ccd6e1; --accent: #1769a5; --button: #e8f3fc; --hover: #d3e9fa;
      --view: #070c13; --overlay: #d2e7f7; --overlay-bg: #07111dc9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --page: #101722; --panel: #192330; --text: #e5eef8; --muted: #a7bad0;
        --border: #34465b; --accent: #84d4ff; --button: #203b50; --hover: #2b506b;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--text); font-family: system-ui, sans-serif; }
    main { width: 100%; max-width: 960px; margin: 24px auto; padding: 0 16px; }
    h1 { font-size: clamp(22px, 4vw, 29px); margin: 0 0 8px; letter-spacing: -.035em; }
    .intro { margin: 0 0 16px; color: var(--muted); line-height: 1.65; font-size: 14px; }
    #view { height: 520px; width: 100%; position: relative; overflow: hidden; border: 1px solid var(--border); border-radius: 14px; background: var(--view); }
    #view canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
    .hint { position: absolute; left: 12px; top: 12px; right: 12px; width: fit-content; max-width: calc(100% - 24px); pointer-events: none; background: var(--overlay-bg); color: var(--overlay); padding: 7px 10px; border-radius: 7px; font-size: 12px; line-height: 1.5; }
    .panel { margin-top: 12px; padding: 16px; border: 1px solid var(--border); border-radius: 14px; background: var(--panel); }
    .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    button { border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; background: var(--button); color: var(--text); font: inherit; font-size: 14px; cursor: pointer; max-width: 100%; }
    button:hover { background: var(--hover); }
    button:first-child { border-color: var(--accent); font-weight: 650; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .sliders { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px 20px; }
    .control { min-width: 0; }
    .control label { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 13px; }
    output { color: var(--accent); font-weight: 650; white-space: nowrap; font-variant-numeric: tabular-nums; }
    input[type="range"] { display: block; width: 100%; margin: 12px 0 0; accent-color: var(--accent); }
    .checks { display: flex; flex-wrap: wrap; gap: 14px 22px; margin-top: 22px; font-size: 14px; }
    .checks label { display: flex; align-items: center; gap: 7px; cursor: pointer; }
    select { max-width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 7px; background: var(--panel); color: var(--text); font: inherit; }
    input[type="checkbox"] { width: 17px; height: 17px; margin: 0; accent-color: var(--accent); }
    .note { margin: 12px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    #status { margin: 12px 0 0; padding: 12px 14px; border: 1px solid var(--border); background: var(--panel); border-radius: 9px; font-size: 13px; line-height: 1.7; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
    @media (max-width: 760px) { .sliders { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 420px) { main { margin-top: 16px; } .panel { padding: 14px; } .sliders { grid-template-columns: minmax(0, 1fr); gap: 16px; } }
  </style>
</head>
<body>
<main>
  <h1>썬더형 번개 나무 데모 v2</h1>
  <p class="intro">감전된 적이 도망치면 전류 끈이 길어지고, 끈을 밟은 적에게 감전이 전파됩니다. 너무 긴 끈은 끊어져 적이 풀려납니다.</p>
  <div id="view" aria-label="번개 마법 삼차원 장면">
    <div class="hint">드래그로 회전 · 휠로 확대 · 바닥을 눌러 시전</div>
  </div>
  <div class="panel">
    <div class="buttons">
      <button id="cast" type="button">적 무리 쪽에 시전</button>
      <button id="redistribute" type="button">적 다시 배치</button>
      <button id="erase" type="button">탄 자국 지우기</button>
    </div>
    <div class="sliders">
      <div class="control"><label for="chain">연쇄 수 <output id="chain-value" for="chain">3마리</output></label><input id="chain" type="range" min="1" max="8" step="1" value="3"></div>
      <div class="control"><label for="range">사거리 <output id="range-value" for="range">11m</output></label><input id="range" type="range" min="5" max="18" step="1" value="11"></div>
      <div class="control"><label for="density">가지 밀도 <output id="density-value" for="density">450개</output></label><input id="density" type="range" min="0" max="900" step="1" value="450"></div>
      <div class="control"><label for="pull">적 끌림 <output id="pull-value" for="pull">2.5</output></label><input id="pull" type="range" min="0" max="6" step="0.1" value="2.5"></div>
      <div class="control"><label for="speed">성장 속도 <output id="speed-value" for="speed">4단계/프레임</output></label><input id="speed" type="range" min="1" max="12" step="1" value="4"></div>
      <div class="control"><label for="delay">낙뢰 지연 <output id="delay-value" for="delay">2.2초</output></label><input id="delay" type="range" min="0.3" max="3" step="0.1" value="2.2"></div>
      <div class="control"><label for="interval">낙뢰 간격 <output id="interval-value" for="interval">0.12초</output></label><input id="interval" type="range" min="0" max="0.4" step="0.01" value="0.12"></div>
      <div class="control"><label for="count">적 수 <output id="count-value" for="count">14마리</output></label><input id="count" type="range" min="0" max="20" step="1" value="14"></div>
      <div class="control"><label for="spread">전파 최대 <output id="spread-value" for="spread">6마리</output></label><input id="spread" type="range" min="0" max="12" step="1" value="6"></div>
      <div class="control"><label for="ropeLength">끈 최대 길이 <output id="ropeLength-value" for="ropeLength">22m</output></label><input id="ropeLength" type="range" min="8" max="40" step="1" value="22"></div>
    </div>
    <div class="checks">
      <label for="reaction">감전 반응 <select id="reaction"><option value="rope" selected>끈 (도망치며 늘어남)</option><option value="stun">경직 (제자리)</option></select></label>
      <label><input id="net" type="checkbox" checked>마무리 그물</label>
      <label><input id="move" type="checkbox" checked>적 배회</label>
    </div>
    <p class="note">전파는 감전 지연 중에만 일어납니다. 청백색 고리는 직접 감전, 보라색 고리는 전파 감전입니다. 슬라이더는 다음 시전에, 감전 반응과 체크 항목은 즉시 적용됩니다. 적 수를 바꾸면 다시 배치됩니다.</p>
  </div>
  <p id="status" role="status" aria-live="polite">대기 · 가지 노드 0 · 감전 0 (직접 0 + 전파 0) · 끊김 0</p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const status = $('status');
  if (!window.THREE) {
    status.textContent = '삼차원 라이브러스를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.';
    return;
  }
  const view = $('view');
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  } catch (error) {
    status.textContent = '삼차원 장면을 시작하지 못했습니다. 브라우저의 그래픽 가속을 확인해 주세요.';
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.8));
  renderer.outputEncoding = THREE.sRGBEncoding;
  view.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x070c13);
  scene.fog = new THREE.Fog(0x070c13, 43, 96);
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 160);
  const orbit = { radius: 22, theta: 0.65, phi: 0.92, target: new THREE.Vector3(0, 1.2, 0) };
  let cameraShift = null;
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
  const random = (a, b) => a + Math.random() * (b - a);
  function updateCamera() {
    const r = orbit.radius, p = orbit.phi, t = orbit.theta;
    camera.position.set(r * Math.sin(p) * Math.sin(t), r * Math.cos(p), r * Math.sin(p) * Math.cos(t)).add(orbit.target);
    camera.lookAt(orbit.target);
  }
  function updateCameraShift(now) {
    if (!cameraShift) return;
    const t = clamp((now - cameraShift.start) / 0.5, 0, 1);
    orbit.target.copy(cameraShift.from).lerp(cameraShift.to, t * t * (3 - 2 * t));
    updateCamera();
    if (t === 1) cameraShift = null;
  }
  function resize() {
    const width = Math.max(1, view.clientWidth);
    renderer.setSize(width, view.clientHeight, false);
    camera.aspect = width / view.clientHeight;
    camera.updateProjectionMatrix();
  }
  updateCamera();
  resize();
  if (window.ResizeObserver) new ResizeObserver(resize).observe(view);
  else window.addEventListener('resize', resize);
  scene.add(new THREE.AmbientLight(0x9ca8b8, 0.72));
  const moon = new THREE.DirectionalLight(0xc1d7eb, 0.38);
  moon.position.set(-8, 18, 9);
  scene.add(moon);
  const flashLight = new THREE.PointLight(0xb9eaff, 0, 32, 2);
  scene.add(flashLight);

  // 바닥과 모든 탄 자국은 같은 1024px 캔버스 텍스처에 그린다.
  const FLOOR = 40, TEXTURE_SIZE = 1024, TEX_SCALE = TEXTURE_SIZE / FLOOR;
  const baseCanvas = document.createElement('canvas');
  baseCanvas.width = baseCanvas.height = TEXTURE_SIZE;
  const base = baseCanvas.getContext('2d');
  const stonePixels = base.createImageData(TEXTURE_SIZE, TEXTURE_SIZE);
  for (let i = 0; i < stonePixels.data.length; i += 4) {
    const n = Math.floor(random(-7, 8));
    stonePixels.data[i] = 74 + n;
    stonePixels.data[i + 1] = 77 + n;
    stonePixels.data[i + 2] = 84 + n;
    stonePixels.data[i + 3] = 255;
  }
  base.putImageData(stonePixels, 0, 0);
  base.strokeStyle = '#10161dcc';
  base.lineWidth = 2;
  for (let row = 0; row < 17; row++) {
    const y = row * 64;
    base.beginPath(); base.moveTo(0, y); base.lineTo(TEXTURE_SIZE, y); base.stroke();
    for (let col = 0; col < 17; col++) {
      const x = col * 64 + (row % 2) * 32;
      base.beginPath(); base.moveTo(x, y); base.lineTo(x + random(-5, 5), y + 64); base.stroke();
    }
  }
  base.strokeStyle = '#3a434e55'; base.lineWidth = 0.8;
  for (let i = 0; i < 480; i++) {
    const x = random(0, TEXTURE_SIZE), y = random(0, TEXTURE_SIZE);
    base.beginPath(); base.moveTo(x, y); base.lineTo(x + random(-14, 14), y + random(3, 20)); base.stroke();
  }
  const floorCanvas = document.createElement('canvas');
  floorCanvas.width = floorCanvas.height = TEXTURE_SIZE;
  const floorContext = floorCanvas.getContext('2d');
  floorContext.drawImage(baseCanvas, 0, 0);
  const floorTexture = new THREE.CanvasTexture(floorCanvas);
  floorTexture.encoding = THREE.sRGBEncoding;
  floorTexture.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(FLOOR, FLOOR), new THREE.MeshStandardMaterial({ map: floorTexture, roughness: 0.98, metalness: 0.02 }));
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);
  const grid = new THREE.GridHelper(FLOOR, 40, 0x7391a6, 0x455c70);
  grid.position.y = 0.014;
  grid.material.transparent = true; grid.material.opacity = 0.13; grid.material.depthWrite = false;
  scene.add(grid);
  let floorDirty = false;
  function texturePoint(p) { return { x: (p.x + 20) * TEX_SCALE, y: (p.z + 20) * TEX_SCALE }; }
  function burnCircle(p, radius) {
    const c = texturePoint(p), r = radius * TEX_SCALE;
    const gradient = floorContext.createRadialGradient(c.x, c.y, r * 0.1, c.x, c.y, r);
    gradient.addColorStop(0, 'rgba(0,0,0,0.96)');
    gradient.addColorStop(0.52, 'rgba(1,1,2,0.94)');
    gradient.addColorStop(1, 'rgba(0,0,0,0)');
    floorContext.save(); floorContext.fillStyle = gradient;
    floorContext.beginPath(); floorContext.arc(c.x, c.y, r, 0, Math.PI * 2); floorContext.fill();
    floorContext.strokeStyle = '#090705b3'; floorContext.lineWidth = 1.3;
    for (let i = 0; i < 10; i++) {
      const a = random(0, Math.PI * 2), d = random(0.6, 1.15) * r;
      floorContext.beginPath(); floorContext.moveTo(c.x, c.y);
      floorContext.lineTo(c.x + Math.cos(a) * d, c.y + Math.sin(a) * d); floorContext.stroke();
    }
    floorContext.restore(); floorDirty = true;
  }
  function burnPath(path) {
    if (path.length < 2) return;
    floorContext.save(); floorContext.beginPath();
    path.forEach((p, i) => { const q = texturePoint(p); if (i === 0) floorContext.moveTo(q.x, q.y); else floorContext.lineTo(q.x, q.y); });
    floorContext.lineJoin = floorContext.lineCap = 'round';
    floorContext.strokeStyle = '#010102f5'; floorContext.lineWidth = 0.22 * TEX_SCALE;
    floorContext.shadowColor = '#000'; floorContext.shadowBlur = 7; floorContext.stroke();
    floorContext.restore(); floorDirty = true;
    addEmbers(path, performance.now() / 1000);
  }
  function burnRopePath(path) {
    if (path.length < 2) return;
    floorContext.save(); floorContext.beginPath();
    path.forEach((p, i) => { const q = texturePoint(p); if (!i) floorContext.moveTo(q.x, q.y); else floorContext.lineTo(q.x, q.y); });
    floorContext.lineJoin = floorContext.lineCap = 'round';
    floorContext.strokeStyle = 'rgba(0,0,0,0.24)'; floorContext.lineWidth = 0.12 * TEX_SCALE;
    floorContext.stroke(); floorContext.restore(); floorDirty = true;
  }

  const cylinderGeometry = new THREE.CylinderGeometry(1, 1, 1, 6, 1, true);
  const cubeGeometry = new THREE.BoxGeometry(0.9, 0.9, 0.9);
  const markerGeometry = new THREE.RingGeometry(0.48, 0.65, 48);
  const arcGeometry = new THREE.RingGeometry(0.67, 0.79, 24, 1, 0, Math.PI * 0.65);
  const warningGeometry = new THREE.RingGeometry(0.76, 0.9, 48);
  const dotCanvas = document.createElement('canvas'); dotCanvas.width = dotCanvas.height = 32;
  const dotContext = dotCanvas.getContext('2d');
  const dotGradient = dotContext.createRadialGradient(16, 16, 0, 16, 16, 16);
  dotGradient.addColorStop(0, '#fff'); dotGradient.addColorStop(0.2, '#d7f6ff'); dotGradient.addColorStop(1, 'rgba(110,201,255,0)');
  dotContext.fillStyle = dotGradient; dotContext.fillRect(0, 0, 32, 32);
  const dotTexture = new THREE.CanvasTexture(dotCanvas);
  const axisY = new THREE.Vector3(0, 1, 0), matrix = new THREE.Matrix4(), quaternion = new THREE.Quaternion();
  const delta = new THREE.Vector3(), midpoint = new THREE.Vector3(), scale = new THREE.Vector3();
  // 적 20개 × 끈당 최대 72선분 = 1,440개. 공용 풀은 1,500개로 고정한다.
  const MAX_ROPE_SEGMENTS = 1500, MAX_ROPE_POINTS = 72, ROPE_DOTS = 5, ROPE_Y = 0.085;
  const ropeMaterial = new THREE.MeshBasicMaterial({ color: 0x9ce6ff, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending, depthWrite: false });
  const ropeMesh = new THREE.InstancedMesh(cylinderGeometry, ropeMaterial, MAX_ROPE_SEGMENTS);
  ropeMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); ropeMesh.frustumCulled = false; ropeMesh.count = 0; scene.add(ropeMesh);
  const MAX_EMBER_SEGMENTS = 600, MAX_SPARKS = 160;
  const embers = [], sparks = [], emberColor = new THREE.Color();
  const emberMesh = new THREE.InstancedMesh(cylinderGeometry, new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false }), MAX_EMBER_SEGMENTS);
  emberMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); emberMesh.frustumCulled = false; emberMesh.count = 0; scene.add(emberMesh);
  const sparkGeometry = new THREE.BufferGeometry();
  sparkGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(MAX_SPARKS * 3), 3).setUsage(THREE.DynamicDrawUsage));
  sparkGeometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(MAX_SPARKS * 3), 3).setUsage(THREE.DynamicDrawUsage));
  sparkGeometry.setDrawRange(0, 0);
  const sparkMesh = new THREE.Points(sparkGeometry, new THREE.PointsMaterial({ vertexColors: true, size: 0.22, map: dotTexture, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  sparkMesh.frustumCulled = false; scene.add(sparkMesh);
  function setSegment(mesh, index, a, b, radius) {
    delta.subVectors(b, a);
    const length = Math.max(0.0001, delta.length());
    quaternion.setFromUnitVectors(axisY, delta.multiplyScalar(1 / length));
    midpoint.addVectors(a, b).multiplyScalar(0.5);
    scale.set(radius, length, radius); matrix.compose(midpoint, quaternion, scale); mesh.setMatrixAt(index, matrix);
  }
  function addEmbers(path, now) {
    for (let i = 1; i < path.length; i++) {
      const a = path[i - 1].clone(), b = path[i].clone(); a.y = b.y = 0.028;
      embers.push({ a, b, start: now });
    }
    if (embers.length > MAX_EMBER_SEGMENTS) embers.splice(0, embers.length - MAX_EMBER_SEGMENTS);
  }
  function addSparks(p, now) {
    for (let i = 0; i < 14; i++) {
      const angle = random(0, Math.PI * 2), speed = random(0.8, 3.6);
      sparks.push({ x: p.x, y: ROPE_Y, z: p.z, vx: Math.cos(angle) * speed, vy: random(1.7, 4.2), vz: Math.sin(angle) * speed, start: now, life: random(0.25, 0.55) });
    }
    if (sparks.length > MAX_SPARKS) sparks.splice(0, sparks.length - MAX_SPARKS);
  }
  function updateGroundEffects(now) {
    let count = 0;
    for (let i = embers.length - 1; i >= 0; i--) if (now - embers[i].start >= 8) embers.splice(i, 1);
    for (const ember of embers) {
      const fade = (1 - (now - ember.start) / 8) ** 1.35;
      setSegment(emberMesh, count, ember.a, ember.b, 0.021);
      emberColor.setRGB(fade, fade * 0.38, fade * 0.045); emberMesh.setColorAt(count++, emberColor);
    }
    emberMesh.count = count; emberMesh.instanceMatrix.needsUpdate = true;
    if (emberMesh.instanceColor) emberMesh.instanceColor.needsUpdate = true;
    const positions = sparkGeometry.attributes.position, colors = sparkGeometry.attributes.color;
    for (let i = sparks.length - 1; i >= 0; i--) if (now - sparks[i].start >= sparks[i].life) sparks.splice(i, 1);
    sparks.forEach((spark, i) => {
      const age = now - spark.start, fade = 1 - age / spark.life;
      positions.setXYZ(i, spark.x + spark.vx * age, Math.max(0.04, spark.y + spark.vy * age - 5 * age * age), spark.z + spark.vz * age);
      colors.setXYZ(i, fade, fade * 0.72, fade * 0.3);
    });
    sparkGeometry.setDrawRange(0, sparks.length); positions.needsUpdate = colors.needsUpdate = true;
  }
  const bolts = [];
  const MAX_BOLT_SEGMENTS = 2048, MAX_BOLTS = 24;
  function removeBolt(bolt) {
    scene.remove(bolt.group); bolt.core.material.dispose(); bolt.outer.material.dispose();
    bolt.core.dispose(); bolt.outer.dispose();
  }
  function addBolt(path, duration, radius, now) {
    const count = Math.min(path.length - 1, MAX_BOLT_SEGMENTS);
    if (count <= 0) return;
    if (bolts.length >= MAX_BOLTS) removeBolt(bolts.shift());
    const coreMaterial = new THREE.MeshBasicMaterial({ color: 0xf5fcff, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
    const outerMaterial = new THREE.MeshBasicMaterial({ color: 0x68c7ff, opacity: 0.32, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
    const core = new THREE.InstancedMesh(cylinderGeometry, coreMaterial, count);
    const outer = new THREE.InstancedMesh(cylinderGeometry, outerMaterial, count);
    core.frustumCulled = outer.frustumCulled = false;
    for (let i = 0; i < count; i++) {
      delta.subVectors(path[i + 1], path[i]);
      const length = Math.max(0.0001, delta.length());
      quaternion.setFromUnitVectors(axisY, delta.multiplyScalar(1 / length));
      midpoint.addVectors(path[i], path[i + 1]).multiplyScalar(0.5);
      scale.set(radius, length, radius); matrix.compose(midpoint, quaternion, scale); core.setMatrixAt(i, matrix);
      scale.set(radius * 5, length, radius * 5); matrix.compose(midpoint, quaternion, scale); outer.setMatrixAt(i, matrix);
    }
    core.instanceMatrix.needsUpdate = outer.instanceMatrix.needsUpdate = true;
    const group = new THREE.Group(); group.add(outer, core); scene.add(group);
    bolts.push({ group, core, outer, start: now, duration, seed: random(0, 20) });
  }
  function flashAt(p, strength) { flashLight.position.set(p.x, 2, p.z); flashLight.intensity = Math.max(flashLight.intensity, strength); }
  function skyPath(p) {
    const start = new THREE.Vector3(p.x + random(-0.8, 0.8), 24, p.z + random(-0.8, 0.8));
    const end = new THREE.Vector3(p.x, 0.07, p.z), path = [start];
    for (let i = 1; i < 26; i++) {
      const t = i / 26, amplitude = 0.65 * Math.sin(Math.PI * t) + 0.08;

      sumX: new Float32Array(MAX_NODES), sumZ: new Float32Array(MAX_NODES), weights: new Float32Array(MAX_NODES),
      branches: createBranches(), branchFadeStart: null, guidedIndex: 0, guidedStart: 0, lastStrikeEnd: 0, noHit: false
    };
    insertGrid(cast, 0);
    for (let i = 0; i < cfg.density; i++) {
      for (let attempt = 0; attempt < 32; attempt++) {
        const angle = random(0, Math.PI * 2), radius = Math.sqrt(Math.random()) * cfg.range;
        const x = center.x + Math.cos(angle) * radius, z = center.z + Math.sin(angle) * radius;
        if (Math.abs(x) > 19.8 || Math.abs(z) > 19.8) continue;
        const distanceSq = (x - center.x) ** 2 + (z - center.z) ** 2;
        cast.attractors.push({ x, z, nearest: 0, distanceSq, alive: distanceSq > KILL_SQ }); break;
      }
    }
    for (const enemy of enemies) {
      const distanceSq = (enemy.pos.x - center.x) ** 2 + (enemy.pos.z - center.z) ** 2;
      if (distanceSq <= cfg.range * cfg.range) cast.targets.push({ enemy, nearest: 0, distanceSq, cachedX: enemy.pos.x, cachedZ: enemy.pos.z, shocked: false });
    }
    addBolt(skyPath(center), 0.5, 0.05, now); burnCircle(center, 1.05); flashAt(center, 30); updateStatus(now);
  }
  function castNearEnemies() {
    if (!enemies.length) { castAt(new THREE.Vector3(0, 0, 0)); return; }
    const average = new THREE.Vector3(); enemies.forEach(enemy => average.add(enemy.pos)); average.multiplyScalar(1 / enemies.length);
    let nearest = enemies[0];
    for (const enemy of enemies) if (enemy.pos.distanceToSquared(average) < nearest.pos.distanceToSquared(average)) nearest = enemy;
    const angle = random(0, Math.PI * 2), radius = random(2.3, 3);
    castAt(new THREE.Vector3(nearest.pos.x + Math.cos(angle) * radius, 0, nearest.pos.z + Math.sin(angle) * radius));
  }
  function finishGrowth(state, now) {
    state.branchFadeStart = now;
    if (!state.shocked.length) { state.phase = 'idle'; state.noHit = true; }
    else { state.phase = 'delay'; state.phaseStart = now; state.phaseEnd = now + state.cfg.delay; }
  }
  function guidedStrike(state, mark, now) {
    if (mark.broken || mark.struck) return;
    const p = mark.enemy.pos.clone();
    addBolt(skyPath(p), 0.4, 0.043, now); burnCircle(p, 1.15); flashAt(p, 30);
    mark.struck = true; mark.enemy.velocityY = 6.4; mark.enemy.jump = 0.015; mark.enemy.flashUntil = now + 0.22;
    // 낙뢰를 맞은 끈은 그 자리에 남고, 모든 유도 낙뢰가 끝난 뒤 함께 사라진다.
    mark.tip.set(p.x, ROPE_Y, p.z); removeIndicator(mark); state.lastStrikeEnd = now + 0.4;
  }
  function startNet(state, now) {
    // 프림 알고리즘: 실제 유도 낙뢰를 맞은 적만 그물의 정점으로 쓴다.
    const points = state.shocked.filter(mark => mark.struck).map(mark => mark.enemy.pos.clone()), used = new Array(points.length).fill(false);
    if (points.length < 2) { state.phase = 'fade'; return; }
    used[0] = true;
    for (let edge = 0; edge < points.length - 1; edge++) {
      let best = Infinity, from = -1, to = -1;
      for (let i = 0; i < points.length; i++) if (used[i]) {
        for (let j = 0; j < points.length; j++) if (!used[j]) {
          const d = points[i].distanceToSquared(points[j]); if (d < best) { best = d; from = i; to = j; }
        }
      }
      if (to < 0) break;
      used[to] = true; addBolt(horizontalPath(points[from], points[to]), 0.35, 0.033, now);
    }
    flashAt(points[0], 12); state.phase = 'net'; state.phaseStart = now; state.phaseEnd = now + 0.35;
  }
  function updateCast(now) {
    const state = cast; if (!state) return;
    if (state.phase === 'primary' && now >= state.phaseEnd) {
      state.phase = 'growth'; state.phaseStart = now; refreshMovingTargets(state); checkHits(state, now);
    }
    if (state.phase === 'growth') {
      refreshMovingTargets(state); checkHits(state, now);
      if (state.directCount >= state.cfg.chain || now - state.phaseStart >= 2.2) finishGrowth(state, now);
      else {
        let budget = MAX_NEW_PER_FRAME;
        for (let step = 0; step < state.cfg.speed && budget > 0; step++) {
          const added = growthStep(state, now, budget); budget -= added;
          if (!added || state.directCount >= state.cfg.chain || state.nodes.length >= MAX_NODES) { finishGrowth(state, now); break; }
        }
      }
    }
    if (state.branchFadeStart !== null && state.branches) {
      const fade = clamp(1 - (now - state.branchFadeStart) / 0.7, 0, 1);
      state.branches.material.opacity = 0.78 * fade; if (fade === 0) removeBranches(state);
    }
    if (state.phase === 'delay' && now >= state.phaseEnd) {
      state.phase = 'guided'; state.guidedStart = state.phaseEnd; state.guidedIndex = 0;
      state.guidedTargets = state.shocked.filter(mark => !mark.broken);
    }
    if (state.phase === 'guided') {
      while (state.guidedIndex < state.guidedTargets.length && now >= state.guidedStart + state.guidedIndex * state.cfg.interval) {
        guidedStrike(state, state.guidedTargets[state.guidedIndex], now); state.guidedIndex++;
      }
      if (state.guidedIndex === state.guidedTargets.length && now >= state.lastStrikeEnd) {
        state.ropeFadeStart = now;
        if ($('net').checked && state.shocked.filter(mark => mark.struck).length > 1) startNet(state, now);
        else state.phase = 'fade';
      }
    }
    if (state.phase === 'net' && now >= state.phaseEnd) state.phase = 'fade';
    if (state.phase === 'fade' && now >= state.ropeFadeStart + 0.4) state.phase = 'idle';
  }
  function updateMarks(now, dt) {
    if (!cast) { ropeMesh.count = 0; return; }
    let progress = 0;
    if (cast.phase === 'delay') progress = clamp((now - cast.phaseStart) / cast.cfg.delay, 0, 1);
    else if (cast.phase === 'guided' || cast.ropeFadeStart !== null) progress = 1;
    const fade = cast.ropeFadeStart === null ? 1 : clamp(1 - (now - cast.ropeFadeStart) / 0.4, 0, 1);
    const radius = 0.035 * (1 + 0.8 * progress);
    ropeMaterial.color.setRGB(0.4 + 0.42 * progress, 0.72 + 0.24 * progress, 1);
    ropeMaterial.opacity = (0.68 + 0.32 * progress) * fade;
    let segmentCount = 0;
    for (const mark of cast.shocked) {
      if (mark.ropeRemoved) continue;
      if (fade === 0) { removeRope(mark); continue; }
      const p = mark.enemy.pos, path = mark.path;
      if (!mark.removed) {
        mark.marker.position.set(p.x, 1.45 + mark.enemy.jump, p.z);
        mark.marker.rotation.y += dt * (3 + 17 * progress * progress);
        mark.markerMaterials[0].opacity = 0.86 + 0.14 * progress;
        mark.markerMaterials[1].opacity = 0.94 + 0.06 * progress;
        mark.warning.position.set(p.x, 0.03, p.z); mark.warning.visible = cast.phase === 'delay' || cast.phase === 'guided';
        mark.warning.material.opacity = 0.2 + 0.65 * progress;
      }
      const lengths = mark.lengths;
      let total = 0;
      for (let i = 1; i <= path.length; i++) {
        const a = path[i - 1], b = path[i] || mark.tip, length = a.distanceTo(b);
        lengths[i - 1] = length; total += length;
        if (length > 0.0001 && segmentCount < MAX_ROPE_SEGMENTS) setSegment(ropeMesh, segmentCount++, a, b, radius);
      }
      mark.visualLength = total;
      const dots = mark.dots.geometry.attributes.position;
      for (let dot = 0; dot < ROPE_DOTS; dot++) {
        let distance = ((now - mark.start) * (4.5 + 4 * progress) + total * dot / ROPE_DOTS) % Math.max(total, 0.001), segment = 0;
        while (segment < path.length - 1 && distance > lengths[segment]) { distance -= lengths[segment]; segment++; }
        const a = path[segment], b = path[segment + 1] || mark.tip, t = clamp(distance / Math.max(lengths[segment], 0.001), 0, 1);
        dots.setXYZ(dot, a.x + (b.x - a.x) * t, 0.13, a.z + (b.z - a.z) * t);
      }
      dots.needsUpdate = true; mark.dots.material.opacity = (0.82 + 0.18 * progress) * fade;
      mark.dots.material.size = 0.3 + 0.12 * progress;
    }
    ropeMesh.count = segmentCount; ropeMesh.instanceMatrix.needsUpdate = true;
  }
  function updateStatus(now) {
    let phase = '대기', nodes = 0, direct = 0, spread = 0, broken = 0;
    if (cast) {
      nodes = cast.nodes.length; broken = cast.brokenCount;
      for (const mark of cast.shocked) if (!mark.broken) { if (mark.source === 'direct') direct++; else spread++; }
      if (cast.phase === 'primary') phase = '1차 낙뢰';
      else if (cast.phase === 'growth') phase = '가지 성장';
      else if (cast.phase === 'delay') phase = '감전 지연 ' + (Math.round(Math.max(0, cast.phaseEnd - now) * 10) / 10).toFixed(1) + '초 남음';
      else if (cast.phase === 'guided') phase = '유도 낙뢰 ' + cast.guidedIndex + '/' + cast.guidedTargets.length;
      else if (cast.phase === 'net') phase = '마무리 그물';
      else if (cast.phase === 'fade') phase = '끈 소멸';
      if (cast.noHit) phase = '대기 (닿은 적 없음)';
    }
    const text = phase + ' · 가지 노드 ' + nodes + ' · 감전 ' + (direct + spread) + ' (직접 ' + direct + ' + 전파 ' + spread + ') · 끊김 ' + broken;
    if (status.textContent !== text) status.textContent = text;
  }
  $('cast').addEventListener('click', castNearEnemies);
  $('redistribute').addEventListener('click', redistributeEnemies);
  $('erase').addEventListener('click', () => { floorContext.clearRect(0, 0, TEXTURE_SIZE, TEXTURE_SIZE); floorContext.drawImage(baseCanvas, 0, 0); embers.length = 0; emberMesh.count = 0; floorDirty = true; });

  const raycaster = new THREE.Raycaster(), mouse = new THREE.Vector2();
  let pointer = null;
  const canvas = renderer.domElement;
  canvas.addEventListener('pointerdown', event => {
    if (event.button !== 0 || pointer) return;
    pointer = { id: event.pointerId, x: event.clientX, y: event.clientY, lastX: event.clientX, lastY: event.clientY, distance: 0 };
    canvas.setPointerCapture(event.pointerId);
  });
  canvas.addEventListener('pointermove', event => {
    if (!pointer || pointer.id !== event.pointerId) return;
    pointer.distance = Math.max(pointer.distance, Math.hypot(event.clientX - pointer.x, event.clientY - pointer.y));

    if (pointer.distance >= 5) { orbit.theta -= dx * 0.006; orbit.phi = clamp(orbit.phi - dy * 0.005, 0.22, 1.33); updateCamera(); }
    pointer.lastX = event.clientX; pointer.lastY = event.clientY;
  });
  canvas.addEventListener('pointerup', event => {
    if (!pointer || pointer.id !== event.pointerId) return;
    const movement = Math.max(pointer.distance, Math.hypot(event.clientX - pointer.x, event.clientY - pointer.y));
    pointer = null;
    if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
    if (movement >= 5) return;

    mouse.set((event.clientX - rect.left) / rect.width * 2 - 1, -(event.clientY - rect.top) / rect.height * 2 + 1);
    raycaster.setFromCamera(mouse, camera);
    const intersections = raycaster.intersectObject(floor, false);
    if (intersections.length) castAt(intersections[0].point);
  });
  canvas.addEventListener('pointercancel', () => { pointer = null; });
  canvas.addEventListener('lostpointercapture', () => { pointer = null; });
  canvas.addEventListener('wheel', event => { event.preventDefault(); orbit.radius = clamp(orbit.radius * Math.exp(event.deltaY * 0.001), 18, 68); updateCamera(); }, { passive: false });
  canvas.addEventListener('contextmenu', event => event.preventDefault());
  let previousTime = performance.now() / 1000, lastStatus = 0, lastFloorUpload = -Infinity;
  function animate(timestamp) {
    const now = timestamp / 1000, dt = clamp(now - previousTime, 0, 0.05); previousTime = now;
    updateCameraShift(now); updateEnemies(dt, now); updateRopePaths(now); updateCast(now);
    checkPropagation(cast, now); updateMarks(now, dt); updateBolts(now, dt); updateGroundEffects(now);
    // 이동 자국이 계속 생겨도 1024px 텍스처의 GPU 업로드는 초당 약 12회로 제한한다.
    if (floorDirty && now - lastFloorUpload >= 1 / 12) { floorTexture.needsUpdate = true; floorDirty = false; lastFloorUpload = now; }
    if (now - lastStatus >= 0.1) { updateStatus(now); lastStatus = now; }
    renderer.render(scene, camera); requestAnimationFrame(animate);
  }
  redistributeEnemies();
  requestAnimationFrame(animate);
  setTimeout(castNearEnemies, 500);
})();
